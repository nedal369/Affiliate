<script>
(function() {
  let allCategories = [];
  let selectedCategories = new Set();
  let discoveryHistory = [];   // [{id, timestamp, label, results: {catId: [deals]}}]
  let allDiscoveredDeals = {}; // {catId: [deals]} — مدمج من كل الدفعات للبحث
  let selectedDeals = new Set();  // Set of deal keys "cat_id:asin"
  let generatedContent = [];  // [{asin, content, model_used, deal}]
  let seenAsins = {};          // { category_id: Set<asin> }

  // ── تحميل التصنيفات ─────────────────────────────────────────────────────────
  async function loadCategories() {
    try {
      const resp = await fetch('/api/deals/categories');
      const data = await resp.json();
      // نعرض فقط التصنيفات المفعّلة
      allCategories = data.filter(c => c.active !== false);
      renderCategories();
    } catch (err) {
      document.getElementById('categories-grid').innerHTML =
        '<p class="text-danger">خطأ في تحميل التصنيفات</p>';
    }
  }

  function renderCategories() {
    const grid = document.getElementById('categories-grid');
    grid.innerHTML = allCategories.map(cat => `
      <div class="category-card ${selectedCategories.has(cat.id) ? 'selected' : ''}"
           onclick="toggleCategory('${cat.id}')" data-cat="${cat.id}">
        <span class="cat-icon">${cat.icon}</span>
        <div class="cat-name">${cat.name_ar}</div>
        <div class="cat-check">${selectedCategories.has(cat.id) ? '✓' : ''}</div>
      </div>
    `).join('');
    updateDiscoverBtn();
  }

  window.toggleCategory = function(id) {
    if (selectedCategories.has(id)) selectedCategories.delete(id);
    else selectedCategories.add(id);
    renderCategories();
  };

  window.selectAllCategories = function() {
    allCategories.forEach(c => selectedCategories.add(c.id));
    renderCategories();
  };

  window.clearCategories = function() {
    selectedCategories.clear();
    renderCategories();
  };

  function updateDiscoverBtn() {
    document.getElementById('discover-btn').disabled = selectedCategories.size === 0;
  }

  // ── اكتشاف العروض ────────────────────────────────────────────────────────────
  window.startDiscovery = async function() {
    if (selectedCategories.size === 0) return;

    const btn = document.getElementById('discover-btn');
    const btnText = document.getElementById('discover-btn-text');
    const progressSection = document.getElementById('progress-section');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    btn.disabled = true;
    btnText.textContent = 'جاري الاكتشاف...';
    progressSection.classList.remove('hidden');

    let progress = 5;
    progressBar.style.width = progress + '%';
    progressText.textContent = `🤖 الذكاء الاصطناعي يبحث في ${selectedCategories.size} تصنيف...`;

    const progressInterval = setInterval(() => {
      if (progress < 85) {
        progress += Math.random() * 8;
        progressBar.style.width = Math.min(progress, 85) + '%';
      }
    }, 1200);

    const seenAsinsPayload = {};
    for (const catId of selectedCategories) {
      if (seenAsins[catId] && seenAsins[catId].size > 0)
        seenAsinsPayload[catId] = [...seenAsins[catId]];
    }

    try {
      const resp = await fetch('/api/deals/discover', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          category_ids: [...selectedCategories],
          seen_asins: Object.keys(seenAsinsPayload).length > 0 ? seenAsinsPayload : null,
        }),
      });

      clearInterval(progressInterval);
      progressBar.style.width = '100%';

      if (!resp.ok) {
        const err = await resp.json();
        throw new Error(err.detail || 'خطأ في الاكتشاف');
      }

      const data = await resp.json();
      const newResults = data.results || {};
      progressText.textContent = '✅ اكتمل البحث!';

      // تسجيل ASINs الجديدة
      for (const [catId, deals] of Object.entries(newResults)) {
        if (!seenAsins[catId]) seenAsins[catId] = new Set();
        (deals || []).forEach(d => seenAsins[catId].add(d.asin));
        if (!allDiscoveredDeals[catId]) allDiscoveredDeals[catId] = [];
        allDiscoveredDeals[catId] = [...(allDiscoveredDeals[catId] || []), ...(deals || [])];
      }

      // إضافة للتاريخ
      const catMap = {};
      allCategories.forEach(c => { catMap[c.id] = c; });
      const catNames = [...selectedCategories]
        .map(id => catMap[id]?.name_ar || id)
        .join('، ');
      discoveryHistory.unshift({
        id: Date.now(),
        timestamp: new Date(),
        label: catNames,
        results: newResults,
      });

      renderResults();
    } catch (err) {
      clearInterval(progressInterval);
      progressBar.style.width = '0%';
      const isKeyError = err.message && err.message.includes('RapidAPI');
      progressText.textContent = '❌ ' + err.message;
      if (isKeyError) {
        showToast('مفتاح RapidAPI غير موجود — أضفه من صفحة الإعدادات', 'error');
        // أظهر رسالة في قسم النتائج
        document.getElementById('results-section').classList.remove('hidden');
        document.getElementById('results-content').innerHTML = `
          <div class="card"><div class="card-body" style="text-align:center;padding:48px;">
            <div style="font-size:48px;margin-bottom:16px;">🔑</div>
            <p style="font-weight:600;margin-bottom:8px;">مفتاح RapidAPI غير موجود</p>
            <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">
              أضف مفتاح RapidAPI من صفحة الإعدادات ← مفاتيح API ← RapidAPI Key
            </p>
            <a href="#" onclick="window.navigateTo && window.navigateTo('settings')" class="btn btn-primary btn-sm">الذهاب للإعدادات</a>
          </div></div>`;
      } else {
        showToast(err.message, 'error');
      }
    } finally {
      btn.disabled = false;
      btnText.textContent = 'اكتشف أفضل العروض';
    }
  };

  // ── مسح التاريخ ──────────────────────────────────────────────────────────────
  window.clearHistory = function() {
    discoveryHistory = [];
    allDiscoveredDeals = {};
    seenAsins = {};
    selectedDeals.clear();
    document.getElementById('results-section').classList.add('hidden');
    document.getElementById('bottom-bar').classList.add('hidden');
    document.getElementById('bottom-bar-spacer')?.classList.add('hidden');
    showToast('تم مسح تاريخ الاكتشاف', 'info');
  };

  // إعادة البحث من جديد (تصفير seen_asins + بدء اكتشاف جديد)
  window.resetSeenAndDiscover = function() {
    seenAsins = {};
    showToast('تم تصفير الفلاتر — يمكنك الاكتشاف من جديد', 'info');
    window.startDiscovery();
  };

  // ── عرض النتائج (مكدّسة) ────────────────────────────────────────────────────
  function renderResults() {
    const section = document.getElementById('results-section');
    const content = document.getElementById('results-content');
    section.classList.remove('hidden');

    const catMap = {};
    allCategories.forEach(c => { catMap[c.id] = c; });

    let totalAll = discoveryHistory.reduce((sum, batch) =>
      sum + Object.values(batch.results).reduce((s, d) => s + (d?.length || 0), 0), 0);
    document.getElementById('results-summary').textContent =
      `${discoveryHistory.length} دفعة اكتشاف — ${totalAll} عرض إجمالاً`;

    let html = '';

    discoveryHistory.forEach((batch, batchIdx) => {
      const isLatest = batchIdx === 0;
      const timeStr = _formatRelativeTime(batch.timestamp);
      let batchTotal = Object.values(batch.results).reduce((s, d) => s + (d?.length || 0), 0);

      if (isLatest) {
        // أحدث دفعة — عرض كبير
        html += `<div class="category-section" style="margin-bottom:0;">`;
        html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--border);">
          <span style="font-size:13px;font-weight:700;color:var(--accent);">🆕 أحدث اكتشاف</span>
          <span style="font-size:11px;color:var(--text-tertiary);">${timeStr}</span>
          <span style="font-size:11px;color:var(--text-tertiary);margin-right:auto;">${batch.label}</span>
        </div>`;
        for (const [catId, deals] of Object.entries(batch.results)) {
          if (!deals || deals.length === 0) continue;
          const cat = catMap[catId] || { name_ar: catId, icon: '📦' };
          html += `
            <div style="margin-bottom:24px;">
              <div class="category-heading">
                <span style="font-size:22px;">${cat.icon}</span>
                <h3>${cat.name_ar}</h3>
                <span class="category-count">${deals.length} منتج</span>
              </div>
              <div class="deals-grid">
                ${deals.map(deal => renderDealCard(catId, deal, false)).join('')}
              </div>
            </div>`;
        }
        if (batchTotal === 0) {
          html += `<div style="text-align:center;padding:32px 0;">
            <div style="font-size:36px;margin-bottom:12px;">🔍</div>
            <p style="color:var(--text-secondary);margin-bottom:8px;">لم يُعثر على عروض في هذه الدفعة</p>
            <p style="font-size:12px;color:var(--text-tertiary);">
              تأكد من وجود مفتاح RapidAPI في <a href="#" onclick="window.navigateTo && window.navigateTo('settings')" style="color:var(--accent);">الإعدادات</a>،
              أو جرّب تصنيفات أخرى.
            </p>
            <button class="btn btn-secondary btn-sm" style="margin-top:12px;" onclick="resetSeenAndDiscover()">🔄 إعادة البحث من جديد</button>
          </div>`;
        }
        html += `</div>`;
      } else {
        // دفعة قديمة — مضغوطة قابلة للتوسيع
        html += `
          <details class="history-batch" style="margin-top:16px;">
            <summary class="history-batch-header" style="list-style:none;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);cursor:pointer;">
              <span style="font-size:13px;">📋 اكتشاف سابق</span>
              <span style="font-size:11px;color:var(--text-tertiary);">${timeStr}</span>
              <span style="font-size:11px;color:var(--text-secondary);">${batch.label}</span>
              <span class="history-batch-toggle">${batchTotal} عرض ▸</span>
            </summary>
            <div class="history-batch-body">`;
        for (const [catId, deals] of Object.entries(batch.results)) {
          if (!deals || deals.length === 0) continue;
          const cat = catMap[catId] || { name_ar: catId, icon: '📦' };
          html += `
              <div style="margin-bottom:16px;">
                <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:8px;">${cat.icon} ${cat.name_ar}</div>
                <div class="deals-grid-small">
                  ${deals.map(deal => renderDealCard(catId, deal, true)).join('')}
                </div>
              </div>`;
        }
        html += `</div></details>`;
      }
    });

    if (discoveryHistory.length === 0) {
      html = `<div class="card"><div class="card-body" style="text-align:center;padding:48px;">
        <div style="font-size:48px;margin-bottom:16px;">🔍</div>
        <p class="text-secondary">لا توجد نتائج بعد. اختر تصنيفات وابدأ الاكتشاف.</p>
      </div></div>`;
    }

    content.innerHTML = html;
    document.getElementById('bottom-bar').classList.remove('hidden');
    updateSelectionBar();
  }

  function renderDealCard(catId, deal, small = false) {
    const key = `${catId}:${deal.asin}`;
    const isSelected = selectedDeals.has(key);

    if (small) {
      const discountHtml = deal.discount_pct > 0
        ? `<span class="discount-badge-small">-${deal.discount_pct}%</span>` : '';
      const priceHtml = deal.price_current > 0
        ? `${discountHtml}<span class="price-current-small">${deal.price_current.toFixed(0)} ر.س</span>`
        : `<span class="price-current-small" style="color:var(--text-tertiary);">—</span>`;
      const imgHtml = deal.image_url
        ? `<img src="${deal.image_url}" class="deal-image-small" alt="" onerror="this.style.display='none'">`
        : `<div class="deal-image-small" style="display:flex;align-items:center;justify-content:center;font-size:24px;">📦</div>`;
      return `
        <div class="deal-card-small ${isSelected ? 'selected' : ''}"
             onclick="toggleDeal('${catId}', '${deal.asin}')" data-key="${key}">
          <div class="select-overlay">${isSelected ? '✓' : ''}</div>
          ${imgHtml}
          <div class="deal-body-small">
            <div class="deal-title-small">${deal.title}</div>
            <div>${priceHtml}</div>
          </div>
        </div>`;
    }

    const imageHtml = deal.image_url
      ? `<img src="${deal.image_url}" class="deal-image" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         <div class="deal-image-placeholder" style="display:none;">📦</div>`
      : `<div class="deal-image-placeholder">📦</div>`;

    const priceHtml = deal.price_current > 0
      ? `<span class="price-current">${deal.price_current.toFixed(0)} ر.س</span>
         ${deal.price_original > deal.price_current
           ? `<span class="price-original">${deal.price_original.toFixed(0)}</span>` : ''}
         ${deal.discount_pct > 0
           ? `<span class="discount-badge">-${deal.discount_pct}%</span>` : ''}`
      : `<span class="price-current text-secondary">السعر غير متاح</span>`;

    const ratingHtml = deal.rating > 0
      ? `<div class="deal-rating"><span>⭐</span> ${deal.rating.toFixed(1)}
         ${deal.rating_count > 0 ? `<span style="color:var(--text-tertiary);">(${deal.rating_count.toLocaleString()})</span>` : ''}
         </div>` : '';

    return `
      <div class="deal-card ${isSelected ? 'selected' : ''}"
           onclick="toggleDeal('${catId}', '${deal.asin}')" data-key="${key}">
        <div class="select-overlay">${isSelected ? '✓' : ''}</div>
        ${imageHtml}
        <div class="deal-body">
          <div class="deal-title">${deal.title}</div>
          <div class="deal-prices">${priceHtml}</div>
          ${ratingHtml}
        </div>
      </div>`;
  }

  window.toggleDeal = function(catId, asin) {
    const key = `${catId}:${asin}`;
    if (selectedDeals.has(key)) selectedDeals.delete(key);
    else selectedDeals.add(key);
    const card = document.querySelector(`[data-key="${key}"]`);
    if (card) {
      const isNow = selectedDeals.has(key);
      card.classList.toggle('selected', isNow);
      card.querySelector('.select-overlay').textContent = isNow ? '✓' : '';
    }
    updateSelectionBar();
  };

  function updateSelectionBar() {
    const count = selectedDeals.size;
    document.getElementById('selected-count').textContent = count;
    document.getElementById('btn-gen-content').disabled = count === 0;
  }

  window.clearSelection = function() {
    selectedDeals.clear();
    document.querySelectorAll('.deal-card.selected, .deal-card-small.selected').forEach(card => {
      card.classList.remove('selected');
      card.querySelector('.select-overlay').textContent = '';
    });
    updateSelectionBar();
  };

  // ── اكتشاف تلقائي وإضافة للانتظار ──────────────────────────────────────────
  window.autoDiscoverAndQueue = async function() {
    const btn = document.getElementById('auto-discover-btn');
    btn.disabled = true;
    btn.innerHTML = '<span style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-left:6px;"></span> جاري الاكتشاف...';

    try {
      const resp = await fetch('/api/deals/auto-discover-and-queue', { method: 'POST' });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || 'خطأ في الاكتشاف');

      const msg = `✅ تمت إضافة ${data.added} منتج لقائمة الانتظار` +
        (data.skipped > 0 ? ` (${data.skipped} منتج مكرر تم تخطيه)` : '');
      showToast(msg, 'success');
    } catch (err) {
      showToast('خطأ: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span>⚡</span> اكتشاف تلقائي وإضافة للانتظار';
    }
  };

  // ── توليد المحتوى ─────────────────────────────────────────────────────────────
  window.generateContent = async function() {
    if (selectedDeals.size === 0) return;

    const btn = document.getElementById('btn-gen-content');
    btn.disabled = true;
    btn.textContent = '⏳ جاري الإنشاء...';

    const dealsToProcess = [];
    for (const key of selectedDeals) {
      const [catId, asin] = key.split(':');
      const catDeals = allDiscoveredDeals[catId] || [];
      const deal = catDeals.find(d => d.asin === asin);
      if (deal) dealsToProcess.push(deal);
    }

    try {
      const resp = await fetch('/api/deals/generate-content', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ deals: dealsToProcess }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || 'خطأ في التوليد');

      generatedContent = data.results.map((r, i) => ({ ...r, deal: dealsToProcess[i] }));
      openContentModal();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🤖 إنشاء المحتوى';
    }
  };

  function openContentModal() {
    const body = document.getElementById('content-modal-body');
    body.innerHTML = generatedContent.map((item, idx) => {
      const deal = item.deal || {};
      const imgHtml = deal.image_url
        ? `<img src="${deal.image_url}" onerror="this.src='';" style="width:40px;height:40px;object-fit:contain;border-radius:6px;">`
        : `<span style="font-size:24px;">📦</span>`;
      return `
        <div class="content-item">
          <div class="content-item-header">
            ${imgHtml}
            <div style="flex:1;">
              <div class="content-item-title">${deal.title || 'منتج'}</div>
              <div>
                ${deal.discount_pct > 0 ? `<span class="badge badge-danger">-${deal.discount_pct}%</span>` : ''}
                ${deal.price_current > 0 ? `<span style="font-size:12px;margin-right:4px;">${deal.price_current.toFixed(0)} ر.س</span>` : ''}
              </div>
            </div>
          </div>
          ${item.error
            ? `<p class="text-danger text-sm">خطأ في التوليد: ${item.error}</p>`
            : `<textarea class="content-textarea" id="content-${idx}" rows="6">${item.content}</textarea>
               <div class="model-tag">🤖 ${item.model_used || 'AI'}</div>`
          }
        </div>`;
    }).join('');
    document.getElementById('content-modal-overlay').classList.remove('hidden');
  }

  window.closeContentModal = function() {
    document.getElementById('content-modal-overlay').classList.add('hidden');
  };

  // ── إضافة للانتظار ────────────────────────────────────────────────────────────
  window.addToQueue = async function() {
    const btn = document.getElementById('btn-publish');
    btn.disabled = true;
    btn.textContent = '⏳ جاري الإضافة...';

    const dealsToAdd = generatedContent
      .map((item, originalIdx) => ({ item, originalIdx }))
      .filter(({ item }) => !item.error)
      .map(({ item, originalIdx }) => {
        const textarea = document.getElementById(`content-${originalIdx}`);
        return {
          ...item.deal,
          content: textarea ? textarea.value : item.content,
          model_used: item.model_used || '',
        };
      });

    if (dealsToAdd.length === 0) {
      showToast('لا يوجد محتوى صالح للإضافة', 'error');
      btn.disabled = false;
      btn.innerHTML = '📋 إضافة لقائمة الانتظار';
      return;
    }

    try {
      const resp = await fetch('/api/deals/add-to-queue', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ deals: dealsToAdd }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || 'خطأ في الإضافة');

      closeContentModal();
      const skippedMsg = data.skipped > 0 ? ` (تم تخطي ${data.skipped} منشور سابقاً)` : '';
      showToast(`✅ تمت إضافة ${data.added} منتج لقائمة الانتظار${skippedMsg}!`, 'success');

      selectedDeals.clear();
      document.querySelectorAll('.deal-card.selected, .deal-card-small.selected').forEach(card => {
        card.classList.remove('selected');
        card.querySelector('.select-overlay').textContent = '';
      });
      updateSelectionBar();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '📋 إضافة لقائمة الانتظار';
    }
  };

  // ── مساعدات ──────────────────────────────────────────────────────────────────
  function _formatRelativeTime(date) {
    const diff = Math.round((Date.now() - date.getTime()) / 1000);
    if (diff < 60) return 'منذ لحظات';
    if (diff < 3600) return `منذ ${Math.round(diff / 60)} دقيقة`;
    if (diff < 86400) return `منذ ${Math.round(diff / 3600)} ساعة`;
    return `منذ ${Math.round(diff / 86400)} يوم`;
  }

  function showToast(msg, type = 'info') {
    if (typeof window.toast === 'function') { window.toast(msg, type); return; }
    const container = document.getElementById('toast-container');
    if (!container) return;
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  loadCategories();

  // ── إدارة التصنيفات ───────────────────────────────────────────────────────────
  let catManagerData = [];
  let editingCatId = null;

  window.openCategoryManager = async function() {
    document.getElementById('cat-manager-overlay').classList.remove('hidden');
    await loadCatManagerList();
  };

  window.closeCategoryManager = function() {
    document.getElementById('cat-manager-overlay').classList.add('hidden');
    resetCategoryForm();
  };

  async function loadCatManagerList() {
    const list = document.getElementById('cat-manager-list');
    list.innerHTML = '<p style="padding:12px;color:var(--text-secondary)">جاري التحميل...</p>';
    try {
      const resp = await fetch('/api/deals/categories');
      catManagerData = await resp.json();
      renderCatManagerList();
    } catch {
      list.innerHTML = '<p style="padding:12px;color:var(--danger)">خطأ في التحميل</p>';
    }
  }

  function renderCatManagerList() {
    const list = document.getElementById('cat-manager-list');
    if (!catManagerData.length) {
      list.innerHTML = '<p style="padding:12px;color:var(--text-secondary)">لا توجد تصنيفات — أضف تصنيفاً من الأسفل</p>';
      return;
    }
    list.innerHTML = catManagerData.map(cat => `
      <div class="cat-manager-row">
        <span class="cat-icon-lg">${cat.icon}</span>
        <div class="cat-info">
          <div class="cat-title">${cat.name_ar}</div>
          <div class="cat-kws">${(cat.keywords || []).join(', ')}</div>
        </div>
        <div class="cat-actions">
          <button class="cat-toggle ${cat.active ? 'on' : 'off'}" title="${cat.active ? 'مفعّل' : 'معطّل'}"
            onclick="toggleCatActive(${cat.db_id}, ${cat.active})"></button>
          <button class="btn btn-secondary btn-sm" onclick="editCategory(${cat.db_id})">✏️</button>
          <button class="btn btn-sm" style="background:var(--danger);color:white;" onclick="deleteCategory(${cat.db_id}, '${cat.name_ar.replace(/'/g, "\\'")}')">🗑</button>
        </div>
      </div>
    `).join('');
  }

  window.toggleCatActive = async function(dbId, currentActive) {
    const cat = catManagerData.find(c => c.db_id === dbId);
    if (!cat) return;
    await fetch(`/api/deals/categories/${dbId}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        name_ar: cat.name_ar, icon: cat.icon,
        keywords: cat.keywords, active: !currentActive,
      }),
    });
    await loadCatManagerList();
    await loadCategories();
  };

  window.editCategory = function(dbId) {
    const cat = catManagerData.find(c => c.db_id === dbId);
    if (!cat) return;
    editingCatId = dbId;
    document.getElementById('cat-form-title').textContent = '✏️ تعديل التصنيف';
    document.getElementById('cat-icon').value = cat.icon;
    document.getElementById('cat-name').value = cat.name_ar;
    document.getElementById('cat-keywords').value = (cat.keywords || []).join(', ');
    document.getElementById('cat-save-btn').textContent = '💾 تحديث';
    document.getElementById('cat-form-wrap').scrollIntoView({behavior: 'smooth'});
  };

  window.deleteCategory = async function(dbId, name) {
    if (!confirm(`هل تريد حذف تصنيف "${name}"؟`)) return;
    const resp = await fetch(`/api/deals/categories/${dbId}`, {method: 'DELETE'});
    if (resp.ok) {
      showToast(`تم حذف "${name}"`, 'success');
      await loadCatManagerList();
      await loadCategories();
    } else {
      showToast('خطأ في الحذف', 'error');
    }
  };

  window.saveCategoryForm = async function() {
    const name_ar = document.getElementById('cat-name').value.trim();
    const icon = document.getElementById('cat-icon').value.trim() || '🛍️';
    const kwRaw = document.getElementById('cat-keywords').value;
    const keywords = kwRaw.split(',').map(k => k.trim()).filter(Boolean);

    if (!name_ar) { showToast('أدخل اسم التصنيف', 'error'); return; }
    if (!keywords.length) { showToast('أدخل كلمة مفتاحية واحدة على الأقل', 'error'); return; }

    const body = {name_ar, icon, keywords, active: true};
    const url = editingCatId ? `/api/deals/categories/${editingCatId}` : '/api/deals/categories';
    const method = editingCatId ? 'PUT' : 'POST';

    try {
      const resp = await fetch(url, {
        method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      const data = await resp.json();
      if (data.success) {
        showToast(editingCatId ? 'تم تحديث التصنيف' : 'تم إضافة التصنيف', 'success');
        resetCategoryForm();
        await loadCatManagerList();
        await loadCategories();
      } else {
        showToast('خطأ في الحفظ', 'error');
      }
    } catch {
      showToast('خطأ في الاتصال', 'error');
    }
  };

  window.resetCategoryForm = function() {
    editingCatId = null;
    document.getElementById('cat-form-title').textContent = '➕ إضافة تصنيف جديد';
    document.getElementById('cat-icon').value = '🛍️';
    document.getElementById('cat-name').value = '';
    document.getElementById('cat-keywords').value = '';
    document.getElementById('cat-save-btn').textContent = '💾 حفظ';
  };

})();
</script>
