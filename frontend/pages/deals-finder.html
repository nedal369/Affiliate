<!-- صفحة اكتشاف العروض بالذكاء الاصطناعي -->
<style>
  .categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .category-card {
    border: 2px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
    background: var(--card);
    user-select: none;
  }
  .category-card:hover { border-color: var(--accent); background: rgba(0,113,227,0.04); }
  .category-card.selected {
    border-color: var(--accent);
    background: rgba(0,113,227,0.08);
  }
  .category-card .cat-icon { font-size: 28px; display: block; margin-bottom: 6px; }
  .category-card .cat-name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .category-card .cat-check {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-radius: 50%;
    margin: 8px auto 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    transition: all 0.15s;
  }
  .category-card.selected .cat-check {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .discover-btn {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .discover-btn:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .discover-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .progress-bar-wrap {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 12px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-text {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 6px;
    text-align: center;
  }

  .results-section { margin-top: 28px; }
  .category-section { margin-bottom: 32px; }
  .category-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
  }
  .category-heading h3 { font-size: 17px; font-weight: 700; }
  .category-count {
    font-size: 11px;
    background: rgba(0,113,227,0.1);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
  }

  .deals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  .deal-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
  }
  .deal-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .deal-card.selected {
    border-color: var(--success);
    box-shadow: 0 0 0 3px rgba(52,199,89,0.15);
  }
  .deal-card .select-overlay {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: white;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: all 0.15s;
    z-index: 2;
    box-shadow: var(--shadow-sm);
  }
  .deal-card.selected .select-overlay {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }
  .deal-card .deal-image {
    width: 100%;
    height: 160px;
    object-fit: contain;
    background: var(--surface);
    padding: 8px;
  }
  .deal-card .deal-image-placeholder {
    width: 100%;
    height: 160px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }
  .deal-card .deal-body { padding: 12px; }
  .deal-card .deal-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
    height: 34px;
  }
  .deal-card .deal-prices {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .deal-card .price-current { font-size: 14px; font-weight: 700; color: var(--text-primary); }
  .deal-card .price-original {
    font-size: 11px;
    color: var(--text-tertiary);
    text-decoration: line-through;
  }
  .deal-card .discount-badge {
    font-size: 11px;
    font-weight: 700;
    background: rgba(255,59,48,0.1);
    color: var(--danger);
    padding: 1px 6px;
    border-radius: 20px;
  }
  .deal-card .deal-rating {
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .bottom-bar {
    position: sticky;
    bottom: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 14px 32px;
    margin: 0 -32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
    z-index: 50;
  }
  .bottom-bar .selection-info { font-size: 13px; color: var(--text-secondary); }
  .bottom-bar .selection-count { font-weight: 700; color: var(--text-primary); }

  /* Content Modal */
  .content-review-modal { max-width: 700px; }
  .content-item {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }
  .content-item-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .content-item-header img {
    width: 40px; height: 40px;
    object-fit: contain;
    border-radius: var(--radius-sm);
    background: white;
  }
  .content-item-title { font-size: 12px; font-weight: 600; flex: 1; }
  .content-textarea {
    width: 100%;
    min-height: 120px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: white;
    font-size: 13px;
    font-family: var(--font);
    direction: rtl;
    resize: vertical;
    line-height: 1.6;
    color: var(--text-primary);
  }
  .content-textarea:focus { outline: none; border-color: var(--accent); }
  .model-tag {
    display: inline-block;
    font-size: 10px;
    background: rgba(0,113,227,0.08);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 10px;
    margin-top: 4px;
  }
</style>

<div class="page-header">
  <div>
    <h2 class="page-title">🔍 اكتشاف أفضل العروض</h2>
    <p class="page-subtitle">الذكاء الاصطناعي يبحث لك عن أفضل العروض في كل تصنيف</p>
  </div>
</div>

<!-- قسم الاختيار -->
<div class="card" style="margin-bottom: 20px;">
  <div class="card-header">
    <span class="card-title">اختر التصنيفات</span>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-secondary btn-sm" onclick="selectAllCategories()">تحديد الكل</button>
      <button class="btn btn-secondary btn-sm" onclick="clearCategories()">مسح الكل</button>
    </div>
  </div>
  <div class="card-body">
    <div class="categories-grid" id="categories-grid">
      <div class="skeleton" style="height:100px;border-radius:var(--radius-md);"></div>
      <div class="skeleton" style="height:100px;border-radius:var(--radius-md);"></div>
      <div class="skeleton" style="height:100px;border-radius:var(--radius-md);"></div>
      <div class="skeleton" style="height:100px;border-radius:var(--radius-md);"></div>
    </div>

    <button class="discover-btn" id="discover-btn" onclick="startDiscovery()" disabled>
      <span>🤖</span> <span id="discover-btn-text">اكتشف أفضل العروض</span>
    </button>
    <div id="progress-section" class="hidden">
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p class="progress-text" id="progress-text">جاري البحث...</p>
    </div>
  </div>
</div>

<!-- نتائج البحث -->
<div id="results-section" class="results-section hidden"></div>

<!-- الشريط السفلي -->
<div class="bottom-bar hidden" id="bottom-bar">
  <div class="selection-info">
    تم اختيار <span class="selection-count" id="selected-count">0</span> منتج
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-secondary" onclick="clearSelection()">إلغاء التحديد</button>
    <button class="btn btn-primary" id="btn-gen-content" onclick="generateContent()" disabled>
      🤖 إنشاء المحتوى
    </button>
  </div>
</div>

<!-- Modal مراجعة المحتوى -->
<div id="content-modal-overlay" class="modal-overlay hidden">
  <div class="modal content-review-modal">
    <div class="modal-header">
      <span class="modal-title">📝 مراجعة المحتوى المولّد</span>
      <button class="modal-close" onclick="closeContentModal()">✕</button>
    </div>
    <div class="modal-body" id="content-modal-body" style="max-height:60vh;overflow-y:auto;"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeContentModal()">إغلاق</button>
      <button class="btn btn-success" id="btn-publish" onclick="publishDeals()">
        📤 نشر المحتوى المحدد
      </button>
    </div>
  </div>
</div>

<script>
(function() {
  let allCategories = [];
  let selectedCategories = new Set();
  let discoveredDeals = {};   // { category_id: [deals] }
  let selectedDeals = new Set();  // Set of deal keys "cat_id:asin"
  let generatedContent = [];  // [{asin, content, model_used, deal}]

  // ── تحميل التصنيفات ─────────────────────────────────────────────────────────
  async function loadCategories() {
    try {
      const resp = await fetch('/api/deals/categories');
      allCategories = await resp.json();
      renderCategories();
    } catch (err) {
      document.getElementById('categories-grid').innerHTML =
        '<p class="text-danger">خطأ في تحميل التصنيفات</p>';
    }
  }

  function renderCategories() {
    const grid = document.getElementById('categories-grid');
    grid.innerHTML = allCategories.map(cat => `
      <div class="category-card ${selectedCategories.has(cat.id) ? 'selected' : ''}"
           onclick="toggleCategory('${cat.id}')" data-cat="${cat.id}">
        <span class="cat-icon">${cat.icon}</span>
        <div class="cat-name">${cat.name_ar}</div>
        <div class="cat-check">${selectedCategories.has(cat.id) ? '✓' : ''}</div>
      </div>
    `).join('');
    updateDiscoverBtn();
  }

  window.toggleCategory = function(id) {
    if (selectedCategories.has(id)) {
      selectedCategories.delete(id);
    } else {
      selectedCategories.add(id);
    }
    renderCategories();
  };

  window.selectAllCategories = function() {
    allCategories.forEach(c => selectedCategories.add(c.id));
    renderCategories();
  };

  window.clearCategories = function() {
    selectedCategories.clear();
    renderCategories();
  };

  function updateDiscoverBtn() {
    const btn = document.getElementById('discover-btn');
    btn.disabled = selectedCategories.size === 0;
  }

  // ── اكتشاف العروض ────────────────────────────────────────────────────────────
  window.startDiscovery = async function() {
    if (selectedCategories.size === 0) return;

    const btn = document.getElementById('discover-btn');
    const btnText = document.getElementById('discover-btn-text');
    const progressSection = document.getElementById('progress-section');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const resultsSection = document.getElementById('results-section');

    btn.disabled = true;
    btnText.textContent = 'جاري الاكتشاف...';
    progressSection.classList.remove('hidden');
    resultsSection.classList.add('hidden');
    resultsSection.innerHTML = '';
    discoveredDeals = {};
    selectedDeals.clear();
    document.getElementById('bottom-bar').classList.add('hidden');

    // محاكاة شريط التقدم
    let progress = 5;
    progressBar.style.width = progress + '%';
    progressText.textContent = `🤖 الذكاء الاصطناعي يبحث في ${selectedCategories.size} تصنيف...`;

    const progressInterval = setInterval(() => {
      if (progress < 85) {
        progress += Math.random() * 8;
        progressBar.style.width = Math.min(progress, 85) + '%';
      }
    }, 1200);

    try {
      const resp = await fetch('/api/deals/discover', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ category_ids: [...selectedCategories] }),
      });

      clearInterval(progressInterval);
      progressBar.style.width = '100%';

      if (!resp.ok) {
        const err = await resp.json();
        throw new Error(err.detail || 'خطأ في الاكتشاف');
      }

      const data = await resp.json();
      discoveredDeals = data.results || {};
      progressText.textContent = '✅ اكتمل البحث!';
      renderResults();
    } catch (err) {
      clearInterval(progressInterval);
      progressBar.style.width = '0%';
      progressText.textContent = '❌ ' + err.message;
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btnText.textContent = 'اكتشف أفضل العروض';
    }
  };

  // ── عرض النتائج ──────────────────────────────────────────────────────────────
  function renderResults() {
    const section = document.getElementById('results-section');
    section.classList.remove('hidden');

    const catMap = {};
    allCategories.forEach(c => { catMap[c.id] = c; });

    let html = '';
    let totalDeals = 0;

    for (const [catId, deals] of Object.entries(discoveredDeals)) {
      if (!deals || deals.length === 0) continue;
      const cat = catMap[catId] || { name_ar: catId, icon: '📦' };
      totalDeals += deals.length;

      html += `
        <div class="category-section">
          <div class="category-heading">
            <span style="font-size:22px;">${cat.icon}</span>
            <h3>${cat.name_ar}</h3>
            <span class="category-count">${deals.length} منتج</span>
          </div>
          <div class="deals-grid">
            ${deals.map(deal => renderDealCard(catId, deal)).join('')}
          </div>
        </div>
      `;
    }

    if (totalDeals === 0) {
      html = `
        <div class="card">
          <div class="card-body" style="text-align:center;padding:48px;">
            <div style="font-size:48px;margin-bottom:16px;">🔍</div>
            <p class="text-secondary">لم يتم العثور على عروض مناسبة في التصنيفات المحددة.<br>
            تأكد من وجود مفتاح RapidAPI في الإعدادات وحاول مجدداً.</p>
          </div>
        </div>
      `;
    }

    section.innerHTML = html;
    document.getElementById('bottom-bar').classList.remove('hidden');
    updateSelectionBar();
  }

  function renderDealCard(catId, deal) {
    const key = `${catId}:${deal.asin}`;
    const isSelected = selectedDeals.has(key);
    const imageHtml = deal.image_url
      ? `<img src="${deal.image_url}" class="deal-image" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         <div class="deal-image-placeholder" style="display:none;">📦</div>`
      : `<div class="deal-image-placeholder">📦</div>`;

    const priceHtml = deal.price_current > 0
      ? `<span class="price-current">${deal.price_current.toFixed(0)} ر.س</span>
         ${deal.price_original > deal.price_current
           ? `<span class="price-original">${deal.price_original.toFixed(0)}</span>`
           : ''}
         ${deal.discount_pct > 0
           ? `<span class="discount-badge">-${deal.discount_pct}%</span>`
           : ''}`
      : `<span class="price-current text-secondary">السعر غير متاح</span>`;

    const ratingHtml = deal.rating > 0
      ? `<div class="deal-rating"><span>⭐</span> ${deal.rating.toFixed(1)}
         ${deal.rating_count > 0 ? `<span style="color:var(--text-tertiary);">(${deal.rating_count.toLocaleString()})</span>` : ''}
         </div>`
      : '';

    return `
      <div class="deal-card ${isSelected ? 'selected' : ''}"
           onclick="toggleDeal('${catId}', '${deal.asin}')"
           data-key="${key}">
        <div class="select-overlay">${isSelected ? '✓' : ''}</div>
        ${imageHtml}
        <div class="deal-body">
          <div class="deal-title">${deal.title}</div>
          <div class="deal-prices">${priceHtml}</div>
          ${ratingHtml}
        </div>
      </div>
    `;
  }

  window.toggleDeal = function(catId, asin) {
    const key = `${catId}:${asin}`;
    if (selectedDeals.has(key)) {
      selectedDeals.delete(key);
    } else {
      selectedDeals.add(key);
    }
    // تحديث بطاقة واحدة فقط بدون إعادة رسم كامل
    const card = document.querySelector(`[data-key="${key}"]`);
    if (card) {
      const isNowSelected = selectedDeals.has(key);
      card.classList.toggle('selected', isNowSelected);
      card.querySelector('.select-overlay').textContent = isNowSelected ? '✓' : '';
    }
    updateSelectionBar();
  };

  function updateSelectionBar() {
    const count = selectedDeals.size;
    document.getElementById('selected-count').textContent = count;
    document.getElementById('btn-gen-content').disabled = count === 0;
  }

  window.clearSelection = function() {
    selectedDeals.clear();
    document.querySelectorAll('.deal-card.selected').forEach(card => {
      card.classList.remove('selected');
      card.querySelector('.select-overlay').textContent = '';
    });
    updateSelectionBar();
  };

  // ── توليد المحتوى ─────────────────────────────────────────────────────────────
  window.generateContent = async function() {
    if (selectedDeals.size === 0) return;

    const btn = document.getElementById('btn-gen-content');
    btn.disabled = true;
    btn.textContent = '⏳ جاري الإنشاء...';

    // جمع بيانات المنتجات المحددة
    const dealsToProcess = [];
    for (const key of selectedDeals) {
      const [catId, asin] = key.split(':');
      const catDeals = discoveredDeals[catId] || [];
      const deal = catDeals.find(d => d.asin === asin);
      if (deal) dealsToProcess.push(deal);
    }

    try {
      const resp = await fetch('/api/deals/generate-content', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ deals: dealsToProcess }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || 'خطأ في التوليد');

      // دمج المحتوى مع بيانات المنتجات
      generatedContent = data.results.map((r, i) => ({
        ...r,
        deal: dealsToProcess[i],
      }));

      openContentModal();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🤖 إنشاء المحتوى';
    }
  };

  function openContentModal() {
    const body = document.getElementById('content-modal-body');
    body.innerHTML = generatedContent.map((item, idx) => {
      const deal = item.deal || {};
      const imgHtml = deal.image_url
        ? `<img src="${deal.image_url}" onerror="this.src='';" style="width:40px;height:40px;object-fit:contain;border-radius:6px;">`
        : `<span style="font-size:24px;">📦</span>`;
      return `
        <div class="content-item">
          <div class="content-item-header">
            ${imgHtml}
            <div style="flex:1;">
              <div class="content-item-title">${deal.title || 'منتج'}</div>
              <div>
                ${deal.discount_pct > 0 ? `<span class="badge badge-danger">-${deal.discount_pct}%</span>` : ''}
                ${deal.price_current > 0 ? `<span style="font-size:12px;margin-right:4px;">${deal.price_current.toFixed(0)} ر.س</span>` : ''}
              </div>
            </div>
          </div>
          ${item.error
            ? `<p class="text-danger text-sm">خطأ في التوليد: ${item.error}</p>`
            : `<textarea class="content-textarea" id="content-${idx}" rows="6">${item.content}</textarea>
               <div class="model-tag">🤖 ${item.model_used || 'AI'}</div>`
          }
        </div>
      `;
    }).join('');

    document.getElementById('content-modal-overlay').classList.remove('hidden');
  }

  window.closeContentModal = function() {
    document.getElementById('content-modal-overlay').classList.add('hidden');
  };

  // ── نشر المحتوى ───────────────────────────────────────────────────────────────
  window.publishDeals = async function() {
    const btn = document.getElementById('btn-publish');
    btn.disabled = true;
    btn.textContent = '⏳ جاري النشر...';

    // تحديث المحتوى من الـ textarea قبل الإرسال
    const dealsToPublish = generatedContent
      .filter(item => !item.error)
      .map((item, idx) => {
        const textarea = document.getElementById(`content-${idx}`);
        return {
          ...item.deal,
          content: textarea ? textarea.value : item.content,
          model_used: item.model_used || '',
        };
      });

    if (dealsToPublish.length === 0) {
      showToast('لا يوجد محتوى صالح للنشر', 'error');
      btn.disabled = false;
      btn.innerHTML = '📤 نشر المحتوى المحدد';
      return;
    }

    try {
      const resp = await fetch('/api/deals/publish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ deals: dealsToPublish }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || 'خطأ في النشر');

      closeContentModal();
      showToast(`✅ تم نشر ${data.published} منتج بنجاح!`, 'success');

      // مسح التحديد بعد النشر
      selectedDeals.clear();
      document.querySelectorAll('.deal-card.selected').forEach(card => {
        card.classList.remove('selected');
        card.querySelector('.select-overlay').textContent = '';
      });
      updateSelectionBar();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '📤 نشر المحتوى المحدد';
    }
  };

  // ── مساعدات ──────────────────────────────────────────────────────────────────
  function showToast(msg, type = 'info') {
    if (typeof window.toast === 'function') { window.toast(msg, type); return; }
    const container = document.getElementById('toast-container');
    if (!container) return;
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  // تشغيل
  loadCategories();
})();
</script>
