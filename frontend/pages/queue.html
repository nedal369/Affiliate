<!-- صفحة قائمة الانتظار -->

<div class="page-header">
  <div>
    <h2 class="page-title">⏳ قائمة الانتظار</h2>
    <p class="page-subtitle" id="queue-count">جاري التحميل...</p>
  </div>
  <div class="page-actions">
    <button class="btn btn-secondary" onclick="loadQueue()">🔄 تحديث</button>
    <button class="btn btn-primary" onclick="openManualLinkModal()">➕ إضافة رابط يدوي</button>
    <button class="btn btn-success" onclick="approveAll()" id="btn-approve-all">✓ قبول الكل للجدولة</button>
  </div>
</div>

<!-- شريط معلومات الجدولة -->
<div id="schedule-info-bar" style="display:none;background:rgba(0,113,227,0.07);border:1px solid rgba(0,113,227,0.18);border-radius:var(--radius-sm);padding:10px 18px;margin-bottom:16px;font-size:13px;color:var(--text-secondary);text-align:center;"></div>

<!-- ── مودال إضافة رابط يدوي ──────────────────────────────────────────────── -->
<div id="manual-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:90%;max-width:520px;animation:modal-in 0.25s ease;">
    <div class="modal-header">
      <h3 class="modal-title">🔗 إضافة رابط إحالة</h3>
      <button class="modal-close" onclick="closeManualModal()">✕</button>
    </div>
    <div class="modal-body">

      <!-- شرح مختصر -->
      <div style="background:rgba(0,113,227,0.06);border:1px solid rgba(0,113,227,0.15);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:20px;font-size:13px;color:var(--text-secondary);line-height:1.6;">
        📋 الصق رابط الإحالة وسيقوم النظام تلقائياً بجلب اسم المنتج والسعر والصورة ثم توليد محتوى تسويقي عربي.
      </div>

      <!-- حقل الرابط فقط -->
      <div class="form-group" style="margin-bottom:20px;">
        <label class="form-label" style="font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:8px;">رابط الإحالة</label>
        <input
          class="form-control"
          type="url"
          id="ml-url"
          placeholder="https://www.amazon.sa/dp/B0XXXXXXXXXX?tag=mytag-21"
          style="font-size:14px;padding:12px 14px;"
          onkeydown="if(event.key==='Enter') submitManualLink()"
        />
        <div style="font-size:11px;color:var(--text-tertiary);margin-top:6px;">يدعم روابط أمازون السعودية والإمارات وغيرها</div>
      </div>

      <!-- نشر تلقائي -->
      <div style="background:var(--surface);border-radius:var(--radius-sm);padding:12px 16px;">
        <div class="toggle-row" style="padding:0;">
          <div>
            <div class="toggle-label" style="font-size:13px;">⚡ نشر تلقائي فور التوليد</div>
            <div class="toggle-desc">ينشر مباشرةً دون مراجعة</div>
          </div>
          <label class="toggle" style="margin-right:8px;">
            <input type="checkbox" id="ml-auto-publish" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeManualModal()">إلغاء</button>
      <button class="btn btn-primary" id="ml-submit-btn" onclick="submitManualLink()" style="min-width:160px;">
        ✨ جلب البيانات وتوليد المحتوى
      </button>
    </div>
  </div>
</div>

<!-- ── مودال نتيجة التوليد ─────────────────────────────────────────────────── -->
<div id="result-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);z-index:1001;align-items:center;justify-content:center;">
  <div style="background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:90%;max-width:600px;max-height:90vh;overflow-y:auto;animation:modal-in 0.25s ease;">
    <div class="modal-header">
      <h3 class="modal-title" id="result-modal-title">✅ تم توليد المحتوى</h3>
      <button class="modal-close" onclick="closeResultModal()">✕</button>
    </div>
    <div class="modal-body">
      <!-- معلومات المنتج -->
      <div id="result-product-info" style="background:var(--surface);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;font-size:13px;"></div>

      <!-- المحتوى المولّد -->
      <label class="form-label">📝 المحتوى التسويقي المولّد</label>
      <textarea id="result-content" class="form-control" rows="12" style="font-size:13px;line-height:1.8;direction:rtl;"></textarea>

      <!-- معلومات النموذج -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">
        <span style="font-size:11px;color:var(--text-tertiary);" id="result-model-tag">🤖 —</span>
        <span style="font-size:11px;color:var(--text-tertiary);" id="result-chars">0 حرف</span>
      </div>
    </div>
    <div class="modal-footer" style="justify-content:space-between;align-items:center;">
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" onclick="copyResultContent()">📋 نسخ المحتوى</button>
        <button class="btn btn-secondary" onclick="closeResultModal()">إغلاق</button>
      </div>
      <div id="result-action-area"></div>
    </div>
  </div>
</div>

<!-- حاوية البطاقات -->
<div id="queue-list">
  <!-- يُملأ ديناميكياً -->
  <div style="text-align:center;padding:64px 0;color:var(--text-tertiary);">
    <div style="font-size:48px;margin-bottom:16px;">⏳</div>
    <p>جاري التحميل...</p>
  </div>
</div>

<style>
.product-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
  overflow: hidden;
  transition: box-shadow 0.2s;
}
.product-card:hover { box-shadow: var(--shadow-md); }

.product-card-header {
  display: flex;
  gap: 16px;
  padding: 20px 24px 16px;
  align-items: flex-start;
}
.product-thumb {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: var(--surface);
  flex-shrink: 0;
}
.product-thumb-placeholder {
  width: 80px;
  height: 80px;
  background: var(--surface);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
}
.product-info { flex: 1; }
.product-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.product-meta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
.meta-item { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
.price-block { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.price-current { font-size: 18px; font-weight: 700; color: var(--text-primary); }
.price-original { font-size: 13px; color: var(--text-tertiary); text-decoration: line-through; }
.discount-tag { background: rgba(52,199,89,0.12); color: var(--success); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }

.product-content {
  padding: 0 24px 16px;
  border-top: 1px solid var(--border);
  margin: 0 24px;
}
.content-label { font-size: 11px; font-weight: 600; color: var(--text-tertiary); margin: 12px 0 6px; }
.content-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.7;
  background: var(--surface);
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  white-space: pre-wrap;
  max-height: 160px;
  overflow-y: auto;
}

.product-actions {
  padding: 14px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: center;
}
.model-tag { margin-right: auto; font-size: 11px; color: var(--text-tertiary); }

.deal-of-day-card {
  border-color: #f5a623;
  box-shadow: 0 0 0 2px rgba(245,166,35,0.2), var(--shadow-sm);
}
.deal-of-day-badge {
  background: linear-gradient(135deg, #f5a623, #e8820c);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 20px;
  white-space: nowrap;
}
.btn-accent {
  background: rgba(0,113,227,0.1);
  color: var(--accent);
  border: 1px solid rgba(0,113,227,0.25);
  font-size: 13px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-accent:hover { background: rgba(0,113,227,0.18); }
.btn-accent:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-warning {
  background: rgba(245,166,35,0.1);
  color: #c47d00;
  border: 1px solid rgba(245,166,35,0.35);
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-warning:hover { background: rgba(245,166,35,0.2); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes modal-in {
  from { opacity: 0; transform: scale(0.95) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
</style>

<script>
let queueData = [];

async function loadQueue() {
  const list = document.getElementById('queue-list');
  list.innerHTML = '<div style="text-align:center;padding:64px 0;"><div class="skeleton" style="height:120px;margin-bottom:16px;"></div><div class="skeleton" style="height:120px;"></div></div>';

  try {
    const [queueResp] = await Promise.all([
      fetch('/api/queue?per_page=200').then(r => r.json()),
      loadScheduleInfo(),
    ]);
    // الـ endpoint الآن يُرجع {total, page, per_page, items}
    queueData = Array.isArray(queueResp) ? queueResp : (queueResp.items || []);
    const total = queueResp.total ?? queueData.length;
    renderQueue();
    document.getElementById('queue-count').textContent = total > 0
      ? `${total} منتج بانتظار الموافقة`
      : 'لا توجد منتجات بانتظار الموافقة';
    document.getElementById('btn-approve-all').disabled = total === 0;
    updateQueueBadge(total);
  } catch (e) {
    list.innerHTML = '<div style="text-align:center;padding:64px;color:var(--danger);">خطأ في تحميل القائمة</div>';
  }
}

async function loadScheduleInfo() {
  try {
    const info = await fetch('/api/queue/schedule-info').then(r => r.json());
    const bar = document.getElementById('schedule-info-bar');
    if (bar) {
      const parts = [];
      if (info.approved_count > 0)
        parts.push(`<strong>${info.approved_count}</strong> معتمد جاهز للنشر`);
      if (info.pending_count > 0)
        parts.push(`<strong>${info.pending_count}</strong> بانتظار الموافقة`);
      if (info.next_publish_at)
        parts.push(`⏰ الموعد القادم: <strong>${info.next_publish_at}</strong>`);
      bar.innerHTML = parts.join(' &nbsp;·&nbsp; ');
      bar.style.display = parts.length ? 'block' : 'none';
    }
  } catch (e) { /* ignore */ }
}

function renderQueue() {
  const list = document.getElementById('queue-list');
  if (!queueData.length) {
    list.innerHTML = `
      <div style="text-align:center;padding:80px 0;color:var(--text-tertiary);">
        <div style="font-size:56px;margin-bottom:16px;">✅</div>
        <h3 style="font-weight:600;color:var(--text-secondary);margin-bottom:8px;">قائمة الانتظار فارغة</h3>
        <p>سيُضاف المنتجات الجديدة تلقائياً في الدورة القادمة</p>
      </div>`;
    return;
  }

  list.innerHTML = queueData.map(p => `
    <div class="product-card${p.is_deal_of_day ? ' deal-of-day-card' : ''}" id="product-${p.id}">
      <div class="product-card-header">
        ${p.image_url
          ? `<img class="product-thumb" src="${p.image_url}" alt="صورة المنتج" loading="lazy" decoding="async" onerror="this.outerHTML='<div class=product-thumb-placeholder>📦</div>'">`
          : '<div class="product-thumb-placeholder">📦</div>'}
        <div class="product-info">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <div class="product-title">${p.title_ar || p.title}</div>
            ${p.is_deal_of_day ? '<span class="deal-of-day-badge">⭐ عرض اليوم</span>' : ''}
          </div>
          ${p.title_ar && p.title !== p.title_ar ? `<div class="text-sm text-secondary">${p.title}</div>` : ''}
          <div class="product-meta">
            <span class="meta-item">📍 ${sourceBadge(p.source)}</span>
            ${p.source_account ? `<span class="meta-item">👤 ${p.source_account}</span>` : ''}
            ${p.source_views ? `<span class="meta-item">👁 ${formatNumber(p.source_views)} مشاهدة</span>` : ''}
            ${p.rating ? `<span class="meta-item">${renderStars(p.rating)} (${formatNumber(p.rating_count)})</span>` : ''}
          </div>
          <div class="price-block">
            <span class="price-current">${p.price_current?.toFixed(2)} ريال</span>
            ${p.price_original > p.price_current ? `<span class="price-original">${p.price_original?.toFixed(2)}</span>` : ''}
            ${p.discount_pct > 0 ? `<span class="discount-tag">خصم ${p.discount_pct}%</span>` : ''}
          </div>
        </div>
        ${p.affiliate_url ? `<a href="${p.affiliate_url}" target="_blank" class="btn btn-secondary btn-sm">🔗 أمازون</a>` : ''}
      </div>

      <div class="product-content">
        <div class="content-label">📝 محتوى النشر المقترح</div>
        ${(p.ai_model_used || '').startsWith('fallback') ? `
          <div style="background:rgba(255,149,0,0.1);border:1px solid rgba(255,149,0,0.3);border-radius:6px;padding:8px 12px;margin-bottom:8px;font-size:12px;color:#b45309;">
            ⚠️ المحتوى أعلاه قالب جاهز — الذكاء الاصطناعي لم يعمل. السبب: <code>${p.ai_model_used.replace('fallback', '').replace(/^[:\s]+/, '') || 'غير معروف'}</code>
            — افحص <a href="/api/ai/diagnostics" target="_blank" style="text-decoration:underline;">صفحة التشخيص</a>.
          </div>
        ` : ''}
        <div class="content-text" id="content-${p.id}">${p.ai_content || 'لا يوجد محتوى مولّد'}</div>
      </div>

      <div class="product-actions">
        <button class="btn btn-success" onclick="approveProduct(${p.id})">✓ قبول للجدولة</button>
        <button class="btn btn-accent" onclick="publishNow(${p.id})" title="نشر فوري بدون انتظار الجدولة">📤 نشر الآن</button>
        <button class="btn btn-secondary" onclick="editProduct(${p.id})">✎ تعديل</button>
        <button class="btn btn-secondary" onclick="regenerateContent(${p.id})" title="إعادة توليد النص بالذكاء الاصطناعي">🔄 إعادة توليد النص</button>
        ${p.is_deal_of_day
          ? `<button class="btn btn-warning btn-sm" onclick="unsetDealOfDay(${p.id})" title="إلغاء عرض اليوم — يُعاد توليد النص بالقالب العادي">⭐ إلغاء عرض اليوم</button>`
          : `<button class="btn btn-secondary btn-sm" onclick="setDealOfDay(${p.id})" title="تعيين كعرض اليوم — يُعاد توليد النص بقالب عرض اليوم تلقائياً">⭐ عرض اليوم</button>`
        }
        <button class="btn btn-danger" onclick="rejectProduct(${p.id})">✕ رفض</button>
        <span class="model-tag" style="${(p.ai_model_used || '').startsWith('fallback') ? 'background:rgba(255,149,0,0.15);color:#b45309;' : ''}">🤖 ${p.ai_model_used || 'غير محدد'}</span>
      </div>
    </div>
  `).join('');
}

// ── الموافقة على منتج (للجدولة) ─────────────────────────────────────────────
async function approveProduct(id) {
  const btn = document.querySelector(`#product-${id} .btn-success`);
  if (btn) { btn.disabled = true; btn.textContent = 'جاري القبول...'; }

  try {
    const resp = await fetch(`/api/queue/${id}/approve`, { method: 'POST' });
    const data = await resp.json();

    if (data.success) {
      document.getElementById(`product-${id}`)?.remove();
      queueData = queueData.filter(p => p.id !== id);
      if (!queueData.length) renderQueue();
      updateQueueBadge(queueData.length);
      showToast('✓ تمت الموافقة — سيُنشر في الموعد المجدول', 'success');
      loadScheduleInfo();
    } else {
      showToast('خطأ في الموافقة', 'error');
      if (btn) { btn.disabled = false; btn.textContent = '✓ قبول للجدولة'; }
    }
  } catch (e) {
    showToast('خطأ: ' + e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '✓ قبول للجدولة'; }
  }
}

// ── نشر فوري (استثنائي) ──────────────────────────────────────────────────────
async function publishNow(id) {
  const btn = document.querySelector(`#product-${id} .btn-accent`);
  if (btn) { btn.disabled = true; btn.textContent = 'جاري النشر...'; }

  try {
    const resp = await fetch(`/api/queue/${id}/publish-now`, { method: 'POST' });
    const data = await resp.json();

    if (data.success) {
      document.getElementById(`product-${id}`)?.remove();
      queueData = queueData.filter(p => p.id !== id);
      if (!queueData.length) renderQueue();
      updateQueueBadge(queueData.length);
      showToast('🚀 تم النشر الفوري بنجاح', 'success');
      loadScheduleInfo();
    } else {
      showToast('خطأ في النشر: ' + (data.error || ''), 'error');
      if (btn) { btn.disabled = false; btn.textContent = '📤 نشر الآن'; }
    }
  } catch (e) {
    showToast('خطأ: ' + e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '📤 نشر الآن'; }
  }
}

// ── إعادة توليد النص ─────────────────────────────────────────────────────────
async function regenerateContent(id) {
  const card = document.getElementById(`product-${id}`);
  const btn = card?.querySelector('button[onclick^="regenerateContent"]');
  if (btn) { btn.disabled = true; btn.textContent = '🔄 جاري التوليد...'; }
  try {
    const resp = await fetch(`/api/products/${id}/regenerate-content`, { method: 'POST' });
    const data = await resp.json();
    if (resp.ok && data.success) {
      showToast('✓ تم إعادة توليد النص (' + (data.model_used || 'غير محدد') + ')', 'success');
      await loadQueue();
    } else {
      showToast('فشل التوليد: ' + (data.detail || data.error || 'خطأ غير معروف'), 'error');
      if (btn) { btn.disabled = false; btn.textContent = '🔄 إعادة توليد النص'; }
    }
  } catch (e) {
    showToast('خطأ: ' + e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '🔄 إعادة توليد النص'; }
  }
}

// ── عرض اليوم ────────────────────────────────────────────────────────────────
async function setDealOfDay(id) {
  const card = document.getElementById(`product-${id}`);
  const btn = card?.querySelector('button[onclick^="setDealOfDay"]');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري التوليد...'; }
  try {
    const resp = await fetch(`/api/products/${id}/deal-of-day`, { method: 'POST' });
    const data = await resp.json();
    if (data.success) {
      showToast('⭐ تم تعيين عرض اليوم وإعادة توليد النص', 'success');
      await loadQueue();
    } else {
      showToast('خطأ: ' + (data.error || data.detail || ''), 'error');
      if (btn) { btn.disabled = false; btn.textContent = '⭐ عرض اليوم'; }
    }
  } catch (e) {
    showToast('خطأ: ' + e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '⭐ عرض اليوم'; }
  }
}

async function unsetDealOfDay(id) {
  const card = document.getElementById(`product-${id}`);
  const btn = card?.querySelector('button[onclick^="unsetDealOfDay"]');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري التوليد...'; }
  try {
    const resp = await fetch(`/api/products/${id}/deal-of-day`, { method: 'DELETE' });
    const data = await resp.json();
    if (data.success) {
      showToast('تم إلغاء عرض اليوم وإعادة توليد النص', 'info');
      await loadQueue();
    } else {
      showToast('خطأ: ' + (data.error || data.detail || ''), 'error');
      if (btn) { btn.disabled = false; btn.textContent = '⭐ إلغاء عرض اليوم'; }
    }
  } catch (e) {
    showToast('خطأ: ' + e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '⭐ إلغاء عرض اليوم'; }
  }
}

// ── رفض منتج ─────────────────────────────────────────────────────────────────
async function rejectProduct(id) {
  showConfirmModal({
    title: 'تأكيد الرفض',
    message: 'هل تريد رفض هذا المنتج وإزالته من قائمة الانتظار؟',
    confirmText: 'رفض المنتج',
    confirmClass: 'btn-danger',
    onConfirm: async () => {
      await fetch(`/api/queue/${id}/reject`, { method: 'POST' });
      document.getElementById(`product-${id}`)?.remove();
      queueData = queueData.filter(p => p.id !== id);
      if (!queueData.length) renderQueue();
      updateQueueBadge(queueData.length);
      showToast('تم رفض المنتج', 'warning');
    },
  });
}

// ── تعديل المحتوى ──────────────────────────────────────────────────────────
function editProduct(id) {
  const product = queueData.find(p => p.id === id);
  if (!product) return;

  showModal({
    title: `✎ تعديل محتوى: ${(product.title_ar || product.title).slice(0, 40)}...`,
    body: `
      <div class="form-group">
        <label class="form-label">نص المنشور</label>
        <textarea class="form-control" id="edit-content" rows="12">${product.ai_content || ''}</textarea>
      </div>`,
    confirmText: 'حفظ وموافقة',
    confirmClass: 'btn-primary',
    onConfirm: async () => {
      const newContent = document.getElementById('edit-content')?.value;
      if (!newContent) return;
      await fetch(`/api/queue/${id}/edit`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ai_content: newContent }),
      });
      product.ai_content = newContent;
      const contentEl = document.getElementById(`content-${id}`);
      if (contentEl) contentEl.textContent = newContent;
      showToast('✓ تم حفظ التعديل', 'success');
    },
  });
}

// ── قبول الكل للجدولة ────────────────────────────────────────────────────────
async function approveAll() {
  if (!queueData.length) return;
  showConfirmModal({
    title: 'قبول الكل للجدولة',
    message: `هل تريد قبول ${queueData.length} منتج وإضافتهم لقائمة النشر المجدول؟`,
    confirmText: 'قبول الكل للجدولة',
    confirmClass: 'btn-success',
    onConfirm: async () => {
      showToast('جاري القبول...', 'info');
      const resp = await fetch('/api/queue/approve-all', { method: 'POST' });
      const data = await resp.json();
      showToast(`✓ تم قبول ${data.approved} منتج — سيُنشرون وفق الجدولة`, 'success');
      await loadQueue();
    },
  });
}

// ── Init ────────────────────────────────────────────────────────────────────
loadQueue();

// تحديث تلقائي كل 30 ثانية للقائمة (بدون إعادة رسم إذا لم يتغير العدد)
let _lastQueueTotal = -1;
setInterval(async () => {
  try {
    const resp = await fetch('/api/queue?per_page=1').then(r => r.json());
    const total = resp.total ?? 0;
    if (total !== _lastQueueTotal) {
      _lastQueueTotal = total;
      await loadQueue();
    }
  } catch { /* تجاهل أخطاء الشبكة */ }
}, 30000);

// ════════════════════════════════════════════════════════════════════════════
// إضافة رابط إحالة يدوي
// ════════════════════════════════════════════════════════════════════════════

function openManualLinkModal() {
  document.getElementById('ml-url').value = '';
  document.getElementById('ml-url').style.borderColor = '';
  document.getElementById('ml-auto-publish').checked = false;
  const btn = document.getElementById('ml-submit-btn');
  btn.disabled = false;
  btn.innerHTML = '✨ جلب البيانات وتوليد المحتوى';

  document.getElementById('manual-modal-overlay').style.display = 'flex';
  setTimeout(() => document.getElementById('ml-url').focus(), 120);
}

function closeManualModal() {
  document.getElementById('manual-modal-overlay').style.display = 'none';
}

const _spinnerHtml = '<span style="display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px;"></span>';

async function submitManualLink() {
  const urlEl = document.getElementById('ml-url');
  const url = urlEl.value.trim();

  if (!url) {
    urlEl.focus();
    urlEl.style.borderColor = 'var(--danger)';
    urlEl.style.boxShadow = '0 0 0 3px rgba(255,59,48,0.15)';
    return;
  }
  urlEl.style.borderColor = '';
  urlEl.style.boxShadow = '';

  const btn = document.getElementById('ml-submit-btn');
  const autoPublish = document.getElementById('ml-auto-publish').checked;

  btn.disabled = true;
  btn.innerHTML = _spinnerHtml + 'جاري جلب بيانات المنتج...';

  try {
    const resp = await fetch('/api/manual-link', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, auto_publish: autoPublish }),
    });

    // تحديث النص أثناء الانتظار (يُبدّل بعد 3 ث)
    const msgTimer = setTimeout(() => {
      if (btn.disabled) btn.innerHTML = _spinnerHtml + 'جاري توليد المحتوى...';
    }, 3000);

    const data = await resp.json();
    clearTimeout(msgTimer);

    if (!resp.ok || !data.success) {
      throw new Error(data.detail || 'حدث خطأ أثناء المعالجة');
    }

    closeManualModal();
    showResultModal(data.product, autoPublish);
    await loadQueue();

  } catch (err) {
    showToast('خطأ: ' + err.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '✨ جلب البيانات وتوليد المحتوى';
  }
}

function showResultModal(product, autoPublished) {
  // معلومات المنتج
  const infoEl = document.getElementById('result-product-info');
  const priceInfo = product.price_current > 0
    ? `<span style="font-weight:700;">${product.price_current.toFixed(2)} ريال</span>`
      + (product.price_original > product.price_current ? ` <span style="text-decoration:line-through;color:var(--text-tertiary);font-size:12px;">${product.price_original.toFixed(2)}</span>` : '')
      + (product.discount_pct > 0 ? ` <span style="background:rgba(52,199,89,0.12);color:var(--success);font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;">خصم ${product.discount_pct}%</span>` : '')
    : '';

  const sourceLabel = product.fetch_source === 'paapi'
    ? '<span style="background:rgba(0,113,227,0.08);color:var(--accent);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;">✓ Amazon PA API</span>'
    : '<span style="background:rgba(255,149,0,0.08);color:var(--warning);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;">↓ جلب من الصفحة</span>';

  infoEl.innerHTML = `
    <div style="display:flex;gap:12px;align-items:flex-start;">
      ${product.image_url
        ? `<img src="${product.image_url}" loading="lazy" decoding="async" style="width:64px;height:64px;object-fit:cover;border-radius:8px;flex-shrink:0;" onerror="this.style.display='none'">`
        : ''}
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;font-size:14px;margin-bottom:6px;line-height:1.4;">${product.title_ar || product.title}</div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          ${priceInfo}
          ${sourceLabel}
          <a href="${product.affiliate_url}" target="_blank" style="color:var(--accent);font-size:12px;margin-right:auto;">🔗 فتح الرابط</a>
        </div>
      </div>
    </div>`;

  // المحتوى
  const contentEl = document.getElementById('result-content');
  contentEl.value = product.ai_content || '';

  // عداد الحروف
  const updateChars = () => {
    document.getElementById('result-chars').textContent = contentEl.value.length + ' حرف';
  };
  contentEl.oninput = updateChars;
  updateChars();

  // النموذج المستخدم
  document.getElementById('result-model-tag').textContent = '🤖 ' + (product.ai_model_used || 'غير محدد');

  // عنوان ومنطقة الإجراء
  const titleEl = document.getElementById('result-modal-title');
  const actionEl = document.getElementById('result-action-area');

  if (autoPublished) {
    titleEl.textContent = '🚀 تم التوليد والنشر';
    actionEl.innerHTML = `<span class="badge badge-success" style="font-size:12px;padding:5px 12px;">✓ تم النشر تلقائياً</span>`;
  } else {
    titleEl.textContent = '✅ تم توليد المحتوى';
    actionEl.innerHTML = `
      <button class="btn btn-success" onclick="approveFromResult(${product.id})">✓ قبول للجدولة</button>
      <button class="btn btn-accent" onclick="publishNowFromResult(${product.id})" style="margin-right:6px;">📤 نشر الآن</button>`;
  }

  document.getElementById('result-modal-overlay').style.display = 'flex';
}

function closeResultModal() {
  document.getElementById('result-modal-overlay').style.display = 'none';
}

async function copyResultContent() {
  const text = document.getElementById('result-content').value;
  try {
    await navigator.clipboard.writeText(text);
    showToast('✓ تم نسخ المحتوى', 'success');
  } catch {
    document.getElementById('result-content').select();
    document.execCommand('copy');
    showToast('✓ تم النسخ', 'success');
  }
}

async function approveFromResult(productId) {
  const btn = document.querySelector('#result-action-area .btn-success');
  if (btn) { btn.disabled = true; btn.textContent = 'جاري القبول...'; }

  const editedContent = document.getElementById('result-content').value;
  await fetch(`/api/queue/${productId}/edit`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ai_content: editedContent }),
  });

  const resp = await fetch(`/api/queue/${productId}/approve`, { method: 'POST' });
  const data = await resp.json();

  if (data.success) {
    closeResultModal();
    showToast('✓ تمت الموافقة — سيُنشر في الموعد المجدول', 'success');
    await loadQueue();
  } else {
    showToast('خطأ في الموافقة', 'error');
    if (btn) { btn.disabled = false; btn.textContent = '✓ قبول للجدولة'; }
  }
}

async function publishNowFromResult(productId) {
  const btn = document.querySelector('#result-action-area .btn-accent');
  if (btn) { btn.disabled = true; btn.textContent = 'جاري النشر...'; }

  const editedContent = document.getElementById('result-content').value;
  await fetch(`/api/queue/${productId}/edit`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ai_content: editedContent }),
  });

  const resp = await fetch(`/api/queue/${productId}/publish-now`, { method: 'POST' });
  const data = await resp.json();

  if (data.success) {
    closeResultModal();
    showToast('🚀 تم النشر الفوري بنجاح', 'success');
    await loadQueue();
  } else {
    showToast('خطأ في النشر: ' + (data.error || ''), 'error');
    if (btn) { btn.disabled = false; btn.textContent = '📤 نشر الآن'; }
  }
}

// إغلاق المودال بالنقر على الخلفية
document.addEventListener('click', e => {
  if (e.target.id === 'manual-modal-overlay') closeManualModal();
  if (e.target.id === 'result-modal-overlay') closeResultModal();
});

// إغلاق بـ Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('result-modal-overlay').style.display !== 'none') closeResultModal();
    else if (document.getElementById('manual-modal-overlay').style.display !== 'none') closeManualModal();
  }
});
</script>
