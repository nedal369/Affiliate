databases:
  # ── قاعدة بيانات PostgreSQL مجانية لتخزين دائم ─────────────────────────────
  # Render يقدم Postgres مجاناً (يبقى البيانات بعد كل deploy/restart بعكس SQLite)
  - name: affiliate-db
    plan: free
    region: frankfurt
    databaseName: affiliate
    user: affiliate

services:
  - type: web
    name: affiliate-automation-system
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # ── مطلوب دائماً ────────────────────────────────────────────────────────
      - key: ENCRYPTION_KEY
        generateValue: true          # يُولَّد تلقائياً عند أول نشر — لا تغيّره أبداً
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production

      # ── قاعدة البيانات — يربط تلقائياً بقاعدة Postgres أعلاه ────────────────
      # هذا هو الفرق الجوهري: البيانات تبقى عبر كل التحديثات والإعادة تشغيل
      - key: DATABASE_URL
        fromDatabase:
          name: affiliate-db
          property: connectionString

      # ── OpenRouter (موصى به — بوابة موحّدة لجميع النماذج) ──────────────────
      - key: OPENROUTER_API_KEY
        sync: false                  # احصل عليه من openrouter.ai — بعض النماذج مجانية

      # ── RapidAPI (بديل Amazon PA API) ───────────────────────────────────────
      - key: RAPIDAPI_KEY
        sync: false                  # Real-Time Amazon Data على rapidapi.com

      # ── مفاتيح الذكاء الاصطناعي (اختياري — يكفي OpenRouter أو واحد) ──────
      - key: ANTHROPIC_API_KEY
        sync: false                  # اضبطه يدوياً في Render Dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false                  # مجاني — الأسرع للبداية

      # ── Amazon Associates (اختياري) ─────────────────────────────────────────
      - key: AMAZON_ACCESS_KEY
        sync: false
      - key: AMAZON_SECRET_KEY
        sync: false
      - key: AMAZON_ASSOCIATE_TAG
        sync: false                  # مثال: yourname-sa-21

      # ── مصادر المنتجات (اختياري) ────────────────────────────────────────────
      - key: APIFY_API_KEY
        sync: false

      # ── Telegram (اختياري) ──────────────────────────────────────────────────
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false                  # مثال: @mychannel أو -100123456789

      # ── WhatsApp / UltraMsg (اختياري) ───────────────────────────────────────
      - key: ULTRAMSG_INSTANCE
        sync: false
      - key: ULTRAMSG_TOKEN
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false                  # مثال: +966501234567

      # ── منصة X / Twitter (اختياري) ──────────────────────────────────────────
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_SECRET
        sync: false
