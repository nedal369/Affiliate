<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دخول مالك المنصة — Admin Panel</title>
  <style>
    :root {
      --primary: #5b3df5;
      --primary-hover: #4a30d9;
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --text: #ffffff;
      --text-secondary: #a0a0b8;
      --border: #2a2a45;
      --danger: #ff4757;
      --success: #2ed573;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Plus Jakarta Sans", sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1535 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
    }
    .header { text-align: center; margin-bottom: 28px; }
    .logo {
      font-size: 44px;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-block;
      background: rgba(91, 61, 245, 0.15);
      color: #a892ff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: var(--text-secondary); }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      background: #0f0f1a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }
    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }
    .alert.error { background: rgba(255, 71, 87, 0.1); color: var(--danger); border: 1px solid rgba(255, 71, 87, 0.25); }
    .footer-note {
      text-align: center;
      margin-top: 22px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🛡️</div>
      <div class="badge">SaaS Operator</div>
      <h1>لوحة مالك المنصة</h1>
      <p class="subtitle">دخول مخصّص لمشغّلي منصة الأتمتة</p>
    </div>

    <div class="alert error" id="alert-error"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username">اسم المستخدم</label>
        <input class="form-control" type="text" id="username" autocomplete="username" required autofocus />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">كلمة المرور</label>
        <input class="form-control" type="password" id="password" autocomplete="current-password" required />
      </div>

      <button class="btn-primary" type="submit" id="submit-btn">دخول</button>
    </form>

    <p class="footer-note">
      هذه ليست لوحة دخول العملاء.<br/>
      مخصصة لمالك/مشغّل منصة الـ SaaS فقط.
    </p>
  </div>

  <script>
    function showError(msg) {
      const el = document.getElementById("alert-error");
      el.textContent = msg;
      el.style.display = "block";
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "جاري الدخول...";
      document.getElementById("alert-error").style.display = "none";

      const payload = {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      };

      try {
        const r = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(payload),
        });
        const data = await r.json();
        if (r.ok && data.success) {
          window.location.href = "/dashboard";
        } else {
          showError(data.detail || "تعذّر تسجيل الدخول");
        }
      } catch (err) {
        showError("خطأ في الاتصال — حاول مجدداً");
      } finally {
        btn.disabled = false;
        btn.textContent = "دخول";
      }
    }
  </script>
</body>
</html>
